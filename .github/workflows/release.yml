name: Publish distributions to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test and build tools
        run: python -m pip install --upgrade pip '.[dev]'
      - name: Run tests
        run: python -m pytest -q
      - name: Build wheel and sdist
        run: python -m build
      - name: Verify archive contents and package metadata
        run: |
          python -m zipfile --list dist/*.whl
          python -m tarfile --list dist/*.tar.gz
          python - <<'PY'
          import email
          import glob
          import pathlib
          import tarfile
          import zipfile

          wheels = glob.glob("dist/*.whl")
          sdists = glob.glob("dist/*.tar.gz")
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists

          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              metadata_name = next(name for name in names if name.endswith(".dist-info/METADATA"))
              metadata = email.message_from_bytes(archive.read(metadata_name))
              assert "xlsform_lint/__init__.py" in names
              assert metadata["Name"] == "xlsform-lint"
              assert metadata["Version"] == "0.1.0"
              assert metadata["License-Expression"] == "Apache-2.0"

          with tarfile.open(sdists[0], "r:gz") as archive:
              names = archive.getnames()
              root = pathlib.PurePosixPath(names[0]).parts[0]
              assert f"{root}/LICENSE" in names
              assert f"{root}/pyproject.toml" in names
              assert f"{root}/src/xlsform_lint/__init__.py" in names
          PY
      - name: Smoke-test the built wheel outside the checkout
        run: |
          python -m venv /tmp/xlsform-lint-wheel-smoke
          /tmp/xlsform-lint-wheel-smoke/bin/python -m pip install dist/*.whl
          mkdir -p /tmp/xlsform-lint-smoke-work
          cd /tmp/xlsform-lint-smoke-work
          /tmp/xlsform-lint-wheel-smoke/bin/python -c "from openpyxl import Workbook; w=Workbook(); s=w.active; s.title='survey'; s.append(('type','name','label')); s.append(('text','name','Name')); t=w.create_sheet('settings'); t.append(('form_title','form_id','version')); t.append(('Smoke','smoke','1')); w.save('smoke.xlsx'); w.close()"
          /tmp/xlsform-lint-wheel-smoke/bin/xlsform-lint --help
          /tmp/xlsform-lint-wheel-smoke/bin/xlsform-lint smoke.xlsx
          /tmp/xlsform-lint-wheel-smoke/bin/python -m pip check
      - name: Upload verified distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions to production PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish exact verified distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
