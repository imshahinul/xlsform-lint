[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xlsform-lint"
version = "0.1.1"
description = "A Ruff/ESLint-style linter for XLSForm, built on pyxform."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "pyxform>=4.5,<4.6",
    "openpyxl==3.1.5",
]

[project.urls]
Repository = "https://github.com/imshahinul/xlsform-lint"
Issues = "https://github.com/imshahinul/xlsform-lint/issues"

[project.scripts]
xlsform-lint = "xlsform_lint.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1,<2",
    "pytest>=8",
    "jsonschema>=4,<5",
    "pre-commit>=3,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
